<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="光影集 - 个人相册网站" />
  <title>光影集 | 个人相册</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.cn" />
  <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin />
  <link href="https://fonts.googleapis.cn/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <svg class="logo-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
        <h1 class="logo-text">GALLERY</h1>
      </div>
      <nav class="album-nav" id="albumNav">
        <!-- 导航按钮由 JS 动态生成 -->
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h2 class="hero-title" id="heroTitle">光影集</h2>
      <p class="hero-desc" id="heroDesc">用镜头记录生活中的每一个瞬间，让时光在光影中永恒。</p>
      <div class="hero-count" id="heroCount"></div>
    </div>
  </section>

  <!-- Photo Grid -->
  <main class="photo-grid" id="photoGrid">
    <!-- 照片由 JS 动态生成 -->
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>CAPTURING MOMENTS</p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="关闭">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <button class="lightbox-prev" id="lightboxPrev" aria-label="上一张">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <div class="lightbox-image-container">
      <img class="lightbox-image" id="lightboxImage" src="" alt="" />
    </div>
    <button class="lightbox-next" id="lightboxNext" aria-label="下一张">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
    <div class="lightbox-info">
      <h3 class="lightbox-title" id="lightboxTitle"></h3>
      <p class="lightbox-counter" id="lightboxCounter"></p>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
